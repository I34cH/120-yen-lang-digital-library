# Chạy trên VM 1 (Frontend).
# Trước khi chạy: copy nginx.conf.example -> nginx.conf và thay <VM2_IP> bằng IP thật của VM 2.

services:
  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: digital_library_frontend
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
