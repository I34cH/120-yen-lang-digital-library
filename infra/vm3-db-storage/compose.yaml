# Chạy trên VM 3 (Database + Object Storage).
# Trước khi chạy: copy .env.example -> .env (KHÔNG commit .env).
# Lưu ý bảo mật: Cấu hình firewall trên VM 3 chỉ cho phép VM 2 truy cập cổng 5432 và 9000;
# cổng quản trị MinIO 9001 chỉ bind vào 127.0.0.1 (không mở công khai).

services:
  postgres:
    image: postgres:16-alpine
    container_name: digital_library_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: digital_library_storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
